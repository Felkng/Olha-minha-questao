services:
  db:
    image: postgres:16-alpine
    container_name: olha_minha_questao_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olha_minha_questao}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-olha_minha_questao}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./pdfReaderWorker
      dockerfile: Dockerfile
    container_name: olha_minha_questao_worker
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olha_minha_questao_app
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-olha_minha_questao}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PDF_WORKER_URL: http://worker:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://olhaminhaquestao.com,https://www.olhaminhaquestao.com,http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: olha_minha_questao_frontend
    depends_on:
      - app
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  postgres_data:

